---

- name: Тестирование правил iptables
  shell: " iptables-restore --test /etc/iptables/rules.v4"
  listen: test rules and restart
  notify:  restart netfilter-persistent service

- name: Перезапускаю systemctl службу netfilter-persistent
  service:
    name: netfilter-persistent
    state: restarted
    enabled: yes
  listen: restart netfilter-persistent service
  notify:  restart amneziawg

- name: Перезапускаю systemctl службу AmneziaWG
  systemd:
    name: "awg-quick@awg0.service"
    enabled: true
    state: restarted
  listen: restart amneziawg
