---

- name: Создаём каталог drop-in
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
  tags: journald_retention

- name: Настроиваем срок хранения журналов
  copy:
    src: retention.conf
    dest: /etc/systemd/journald.conf.d/retention.conf
    mode: "0644"
  notify: systemd-journald:restart
  tags: journald_retention
