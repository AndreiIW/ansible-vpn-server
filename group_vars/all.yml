---

# Настройка пользователя на сервере. Так как на сервере не безопасно выставлять на ружу пользователя root, то на сервере
# создаётся новый пользователь. После чего на сервере отключается авторизация пользоваталю root и авторизация по логину и паролю.
# Будет доступна только авторизация по ключу.

# имя пользователя которое создаться на сервере
server_user: test
# адрес публичного ключа пользователя
server_user_ssh_key_path: "{{ playbook_dir }}/key/public-key.pub"


# Тут пойдут настройки сервера AmneziaWG.

# Настройка сети для vpn AmneziaWG
awg_server_network: "10.66.66.0/24"
awg_server_ip: "10.66.66.1/24"
awg_client_ip: "10.66.66.2/32"

# Учетные данные админа для web управления пользователями AmneziaWG (обязательно измените при использовании!)
amneziawg_web_admin_user: "admin"
amneziawg_web_admin_pass: "12345678"

# Доменное имя web управления пользователями AmneziaWG. Если оставить пустым, доступ будет по ip адресу.
amneziawg_web_domain: ""

# Если зананно доменное имя в переменной amneziawg_web_domain, то на этот домен выпишется SSL сертификат Let's Encrypt.
# Иначе посмотрим на ip адрес. Если он белый, то Let's Encrypt выпишет на него сертификат. А если ip адрес из серой
# bogon сети, тогда сгенерируется самоподписанный сертификат на IP адрес. 
certbot_domain_name: "{{ amneziawg_web_domain }}" 
certbot_email: "webmaster@{{ amneziawg_web_domain }}"

# Данные для базовой авторизации
nginx_auth_user: "admin"
nginx_auth_password: "12345678"



